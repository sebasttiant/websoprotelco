name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: websoprotelco_ci_test
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ${{ secrets.CI_TEST_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d websoprotelco_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Must embed CI_TEST_PASSWORD and target websoprotelco_ci_test. See README "CI secrets".
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bounded on purpose: an unbounded `until` loop turns an unreachable database into a
      # job that hangs until the GitHub-wide timeout instead of failing with a clear cause.
      - name: Wait for test PostgreSQL
        run: |
          for attempt in $(seq 1 60); do
            if pg_isready --host 127.0.0.1 --port 5432 --username ci_test_user --dbname websoprotelco_ci_test; then
              echo "PostgreSQL is ready after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: PostgreSQL was not ready after 60 attempts (60s)."
          exit 1

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Verify migration idempotency
        run: pnpm db:migrate

      - name: Reset test database
        run: pnpm test:db:reset

      - name: Reapply migrations after reset
        run: pnpm db:migrate

      - name: Seed test database
        run: pnpm test:db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The one unit-test run of the pipeline. Coverage is a report, not a gate: there is no global
      # percentage, because the critical paths (authorization, uploads, deploy) are pinned by named
      # tests and the isolated authenticated E2E job below.
      - name: Unit tests with coverage report
        run: pnpm test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke tests
        env:
          PORT: 8598
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8598
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      # Boots the standalone output the Docker runner ships and asserts over HTTP that a file
      # written AFTER startup is served immediately. No unit test can see that: it is a property
      # of the framework's boot-time public-file index, not of the handler.
      - name: Runtime asset delivery contract
        run: pnpm test:contract:assets

      - name: Collect PostgreSQL diagnostics on failure
        if: ${{ failure() }}
        run: docker ps --all --format 'table {{.Names}}\t{{.Status}}'

      - name: Cleanup CI test resources
        if: ${{ always() }}
        run: docker ps --all --format 'table {{.Names}}\t{{.Status}}'

  container:
    name: Docker build and Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Offline deploy/rollback contracts: `docker` and `git` are stubs, so nothing touches a real host.
      - name: Deploy and rollback shell contracts
        run: bash tests/deploy/run-all.sh

      - name: Validate Compose configuration contract
        run: bash tests/deploy/compose-contract.sh

      - name: Runtime image shell contract
        run: bash tests/deploy/runtime-manifest.sh

      - name: Build runtime image
        run: docker build --network host --target runner -t websoprotelco:ci .

      - name: Build migrator image
        run: docker build --network host --target migrator -t websoprotelco-migrator:ci .

  # Authenticated Playwright suite against a throwaway PostgreSQL. `pnpm test:e2e:auth` owns the
  # whole lifecycle: it generates the credentials, starts compose.e2e.yaml on 127.0.0.1:55432
  # (tmpfs, no volume), runs the app from a temporary workspace, and destroys everything afterwards.
  # No repository secret is needed or passed, and it never touches real infrastructure.
  e2e-authenticated:
    name: Authenticated E2E (isolated database)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Authenticated E2E tests
        run: pnpm test:e2e:auth
